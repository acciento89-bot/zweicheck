services:
  zweicheck:
    build:
      context: ./zweicheck
      dockerfile: Dockerfile
    container_name: zweicheck
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
