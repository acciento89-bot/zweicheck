name: ZweiCheck
options:
  bundleIdPrefix: com.kamilunavo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  ZweiCheck:
    type: application
    platform: iOS
    sources:
      - ZweiCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamilunavo.zweicheck
        PRODUCT_NAME: ZweiCheck
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ZweiCheck
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
schemes:
  ZweiCheck:
    build:
      targets:
        ZweiCheck: all
    run:
      config: Debug
