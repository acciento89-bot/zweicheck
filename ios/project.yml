name: ZweiCheck
options:
  bundleIdPrefix: de.kamilunavo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "TKG684N5GL"
targets:
  ZweiCheck:
    type: application
    platform: iOS
    sources:
      - ZweiCheck
    dependencies:
      - target: ZweiCheckShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kamilunavo.zweicheck
        PRODUCT_NAME: ZweiCheck
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ZweiCheck
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: ZweiCheck/ZweiCheck.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production

  ZweiCheckShare:
    type: app-extension
    platform: iOS
    sources:
      - ZweiCheckShare
    info:
      path: ZweiCheckShare/Info.plist
      properties:
        CFBundleDisplayName: Mit ZweiCheck prüfen
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kamilunavo.zweicheck.share
        PRODUCT_NAME: ZweiCheckShare
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_ENTITLEMENTS: ZweiCheckShare/ZweiCheckShare.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

schemes:
  ZweiCheck:
    build:
      targets:
        ZweiCheck: all
        ZweiCheckShare: all
    run:
      config: Debug
