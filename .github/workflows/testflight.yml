name: ZweiCheck TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/project.yml'

permissions:
  contents: read

concurrency:
  group: zweicheck-testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: TKG684N5GL
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Xcode-Version
        run: xcodebuild -version

      - name: TestFlight-Secrets prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID" || { echo "ASC_ISSUER_ID fehlt"; exit 1; }
          test -n "$ASC_KEY_ID" || { echo "ASC_KEY_ID fehlt"; exit 1; }
          test -n "$ASC_PRIVATE_KEY_B64" || { echo "ASC_PRIVATE_KEY_B64 fehlt"; exit 1; }

      - name: App Store Connect API Key bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q "BEGIN PRIVATE KEY" "$KEY_PATH" || { echo "Der API-Key konnte nicht korrekt dekodiert werden."; exit 1; }

      - name: Build-Werkzeuge installieren
        run: brew install xcodegen librsvg

      - name: App-Icon aus ZweiCheck-Markenlogo erzeugen
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="assets/brand/zweicheck-mark.svg"
          TARGET="ios/ZweiCheck/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          TEMP_SVG="$RUNNER_TEMP/zweicheck-app-icon.svg"
          TEMP_RGBA="$RUNNER_TEMP/zweicheck-app-icon-rgba.png"
          TEMP_JPG="$RUNNER_TEMP/zweicheck-app-icon-flat.jpg"

          test -f "$SOURCE"
          sed 's/<rect width="512" height="512" rx="112" fill="#0D1B2A"\/>/<rect width="512" height="512" fill="#0D1B2A"\/>/' "$SOURCE" > "$TEMP_SVG"
          rsvg-convert -w 1024 -h 1024 "$TEMP_SVG" -o "$TEMP_RGBA"
          sips -s format jpeg -s formatOptions 100 "$TEMP_RGBA" --out "$TEMP_JPG" >/dev/null
          sips -s format png "$TEMP_JPG" --out "$TARGET" >/dev/null

          WIDTH=$(sips -g pixelWidth "$TARGET" | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight "$TARGET" | awk '/pixelHeight/ {print $2}')
          test "$WIDTH" = "1024" && test "$HEIGHT" = "1024"
          echo "ZweiCheck App-Icon: ${WIDTH}x${HEIGHT}"

      - name: Xcode-Projekt erzeugen
        working-directory: ios
        run: xcodegen generate

      - name: Signing-Konfiguration prüfen
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=$(xcodebuild \
            -project ZweiCheck.xcodeproj \
            -scheme ZweiCheck \
            -configuration Release \
            -showBuildSettings)
          echo "$SETTINGS" | grep -E 'CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE_SPECIFIER' || true
          if echo "$SETTINGS" | grep -q 'CODE_SIGN_STYLE = Manual'; then
            echo "Release-Konfiguration ist noch auf manuelle Signierung gestellt."
            exit 1
          fi

      - name: Release archivieren
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          xcodebuild \
            -project ZweiCheck.xcodeproj \
            -scheme ZweiCheck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ZweiCheck.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

      - name: Archiv-Signaturen prüfen
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ZweiCheck.xcarchive/Products/Applications/ZweiCheck.app"
          SHARE="$APP/PlugIns/ZweiCheckShare.appex"

          test -d "$APP"
          test -d "$SHARE"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$SHARE"
          echo "Haupt-App Signatur:"
          codesign -dvv "$APP" 2>&1 | grep -E 'Identifier=|Authority=|TeamIdentifier=' || true
          echo "Share Extension Signatur:"
          codesign -dvv "$SHARE" 2>&1 | grep -E 'Identifier=|Authority=|TeamIdentifier=' || true

      - name: Export-Optionen erstellen
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Mit Apple Cloud Signing zu TestFlight hochladen
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/ZweiCheck.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlightExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: API Key entfernen
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
