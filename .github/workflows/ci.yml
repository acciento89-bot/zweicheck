name: ZweiCheck CI

on:
  push:
    branches: [main, phase-3-mvp]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zweicheck_test
          POSTGRES_USER: zweicheck
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zweicheck -d zweicheck_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        run: npm install
      - name: Syntax prüfen
        run: npm run check
      - name: Unit-Tests
        run: npm test
      - name: Datenbankschema anwenden
        env:
          DATABASE_URL: postgresql://zweicheck:test_password@127.0.0.1:5432/zweicheck_test
        run: npm run migrate
      - name: Server-Smoke-Test
        env:
          DATABASE_URL: postgresql://zweicheck:test_password@127.0.0.1:5432/zweicheck_test
          APP_BASE_URL: http://127.0.0.1:3000
          SESSION_COOKIE_SECURE: "false"
          EMAIL_MODE: log
          UPLOAD_DIR: /tmp/zweicheck-uploads
        run: |
          npm start > /tmp/zweicheck.log 2>&1 &
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health | grep -q ok; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/zweicheck.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:3000/push-client.js | grep -q 'Notification.requestPermission'
          curl -fsS http://127.0.0.1:3000/deep-link.js | grep -q 'requestedCheckId'
      - name: Docker-Image bauen
        run: docker build -t zweicheck:test .
