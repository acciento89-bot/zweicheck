name: ZweiCheck CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript prüfen
        run: npm run check

      - name: Erforderliche Dateien prüfen
        run: |
          test -f index.html
          test -f app.css
          test -f app.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f Dockerfile
          test -f deploy/nginx.conf
          grep -q "Prüfung starten" app.js
          grep -q "Gemeinsam prüfen. Sicher handeln." index.html

      - name: Docker-Image bauen und prüfen
        run: |
          docker build -t zweicheck:test .
          docker run -d --name zweicheck-test -p 8080:80 zweicheck:test
          trap 'docker rm -f zweicheck-test >/dev/null 2>&1 || true' EXIT
          for attempt in {1..15}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health | grep -q "ok"
          curl -fsS http://127.0.0.1:8080/ | grep -q "ZweiCheck"
