name: ZweiCheck CI

on:
  push:
    branches: [main, phase-3-mvp]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zweicheck_test
          POSTGRES_USER: zweicheck
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zweicheck -d zweicheck_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        run: npm install
      - name: Syntax prüfen
        run: npm run check
      - name: Unit-Tests
        run: npm test
      - name: Datenbankschema anwenden
        env:
          DATABASE_URL: postgresql://zweicheck:test_password@127.0.0.1:5432/zweicheck_test
        run: npm run migrate
      - name: Aktivitätsereignisse prüfen
        env:
          DATABASE_URL: postgresql://zweicheck:test_password@127.0.0.1:5432/zweicheck_test
        run: node scripts/activity-db-check.js
      - name: Vertrauensrouting prüfen
        env:
          DATABASE_URL: postgresql://zweicheck:test_password@127.0.0.1:5432/zweicheck_test
        run: node scripts/trust-routing-db-check.js
      - name: Eskalationsautomatik prüfen
        env:
          DATABASE_URL: postgresql://zweicheck:test_password@127.0.0.1:5432/zweicheck_test
        run: node scripts/escalation-db-check.js
      - name: Kontodaten und Löschung prüfen
        env:
          DATABASE_URL: postgresql://zweicheck:test_password@127.0.0.1:5432/zweicheck_test
          UPLOAD_DIR: /tmp/zweicheck-account-db
        run: node scripts/account-db-check.js
      - name: Server-Smoke-Test
        env:
          DATABASE_URL: postgresql://zweicheck:test_password@127.0.0.1:5432/zweicheck_test
          APP_BASE_URL: http://127.0.0.1:3000
          SESSION_COOKIE_SECURE: "false"
          EMAIL_MODE: log
          UPLOAD_DIR: /tmp/zweicheck-uploads
        run: |
          npm start > /tmp/zweicheck.log 2>&1 &
          server_pid=$!
          ready=0
          for attempt in {1..30}; do
            health="$(curl -fsS http://127.0.0.1:3000/health 2>/dev/null || true)"
            if [ "$health" = "ok" ]; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/zweicheck.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:3000/push-client.js -o /tmp/push-client.js
          curl -fsS http://127.0.0.1:3000/deep-link.js -o /tmp/deep-link.js
          curl -fsS http://127.0.0.1:3000/activity-center.js -o /tmp/activity-center.js
          curl -fsS http://127.0.0.1:3000/activity-center.css -o /tmp/activity-center.css
          curl -fsS http://127.0.0.1:3000/trust-routing.js -o /tmp/trust-routing.js
          curl -fsS http://127.0.0.1:3000/trust-routing.css -o /tmp/trust-routing.css
          curl -fsS http://127.0.0.1:3000/escalation-client.js -o /tmp/escalation-client.js
          curl -fsS http://127.0.0.1:3000/escalation.css -o /tmp/escalation.css
          curl -fsS http://127.0.0.1:3000/account-client.js -o /tmp/account-client.js
          curl -fsS http://127.0.0.1:3000/account.css -o /tmp/account.css
          grep -q 'Notification.requestPermission' /tmp/push-client.js
          grep -q 'requestedCheckId' /tmp/deep-link.js
          grep -q 'zc-activity-overlay' /tmp/activity-center.js
          grep -q 'zc-activity-card' /tmp/activity-center.css
          grep -q 'fallbackReviewerId' /tmp/trust-routing.js
          grep -q 'zc-routing-card' /tmp/trust-routing.css
          grep -q 'escalationReminderMinutes' /tmp/escalation-client.js
          grep -q 'zc-escalation-card' /tmp/escalation.css
          grep -q 'data-zc-account-export' /tmp/account-client.js
          grep -q 'zc-delete-confirm' /tmp/account.css
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/activities)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/trust-routing)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/checks/11111111-1111-4111-8111-111111111111/escalation)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/account/export)" = "401"
          test "$(curl -s -X DELETE -H 'Content-Type: application/json' -d '{"password":"test"}' -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/account)" = "401"
      - name: Docker-Image bauen und Runtime-Patches prüfen
        run: |
          docker build -t zweicheck:test .
          docker run --rm --entrypoint sh zweicheck:test -c '
            grep -Fq "observer.observe(appRoot, { childList: true });" /app/trust-routing.js &&
            ! grep -Fq "observer.observe(document.documentElement, { childList: true, subtree: true });" /app/trust-routing.js &&
            grep -Fq "registerEscalationRoutes(app" /app/server/index.js &&
            grep -Fq "startEscalationWorker();" /app/server/index.js &&
            grep -Fq "reminderMinutes: req.body.escalationReminderMinutes" /app/server/index.js &&
            grep -Fq "eventType === '\''check_reminder'\''" /app/server/push.js &&
            grep -Fq "eventType === '\''check_reminder'\''" /app/server/notification-worker.js &&
            grep -Fq "registerAccountRoutes" /app/server/activity.js &&
            grep -Fq "app.delete('\''/api/account'\''" /app/server/account.js &&
            grep -Fq "account-privacy-v1" /app/index.html &&
            grep -Fq "data-zc-delete-form" /app/account-client.js
          '
