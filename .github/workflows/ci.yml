name: ZweiCheck CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript prüfen
        run: npm run check
      - name: Erforderliche Dateien prüfen
        run: |
          test -f index.html
          test -f app.css
          test -f app.js
          test -f manifest.webmanifest
          test -f sw.js
          grep -q "Prüfung starten" app.js
          grep -q "Gemeinsam prüfen. Sicher handeln." index.html
