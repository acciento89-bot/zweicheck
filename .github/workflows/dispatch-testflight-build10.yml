name: Dispatch ZweiCheck TestFlight build 10

on:
  push:
    branches: [main]
    paths:
      - '.github/release-testflight-10'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Build 10 TestFlight starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight.yml --ref main --repo "$GITHUB_REPOSITORY"
