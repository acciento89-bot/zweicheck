name: ZweiCheck IAP Review Availability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iap-review-availability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: macos-26
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: API Key bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Python-Umgebung
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet pyjwt cryptography requests
      - name: Subscription-Verfügbarkeit für Review-Storefronts setzen
        shell: bash
        run: |
          "$RUNNER_TEMP/asc-venv/bin/python" - <<'PY'
          import os, time, jwt, requests

          temp = os.environ['RUNNER_TEMP']
          key = open(temp + '/AuthKey.p8', 'r', encoding='utf-8').read()
          token = jwt.encode(
              {'iss': os.environ['ASC_ISSUER_ID'], 'iat': int(time.time()), 'exp': int(time.time()) + 600, 'aud': 'appstoreconnect-v1'},
              key,
              algorithm='ES256',
              headers={'kid': os.environ['ASC_KEY_ID'], 'typ': 'JWT'}
          )
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          base = 'https://api.appstoreconnect.apple.com/v1'

          territories_resp = requests.get(base + '/territories', headers=headers, params={'limit':'200'}, timeout=30)
          if territories_resp.status_code != 200:
              raise SystemExit(f'Territories konnten nicht geladen werden: HTTP {territories_resp.status_code}\n{territories_resp.text[:3000]}')
          territories = [
              {'type':'territories', 'id': item['id']}
              for item in territories_resp.json().get('data', [])
          ]
          if len(territories) < 100:
              raise SystemExit(f'Unerwartet wenige Territories: {len(territories)}')
          print(f'Apple Territories geladen: {len(territories)}')

          subscriptions = [
              ('6800860430', 'de.kamilunavo.zweicheck.premium.family.yearly'),
              ('6800865121', 'de.kamilunavo.zweicheck.premium.family.monthly'),
          ]

          for subscription_id, product_id in subscriptions:
              payload = {
                  'data': {
                      'type': 'subscriptionAvailabilities',
                      'attributes': {'availableInNewTerritories': True},
                      'relationships': {
                          'availableTerritories': {'data': territories},
                          'subscription': {
                              'data': {'type': 'subscriptions', 'id': subscription_id}
                          }
                      }
                  }
              }
              response = requests.post(base + '/subscriptionAvailabilities', headers=headers, json=payload, timeout=60)
              print(f'{product_id}: POST availability HTTP {response.status_code}')
              if response.status_code not in (200, 201):
                  raise SystemExit(response.text[:8000])

              verify = requests.get(
                  base + f'/subscriptionAvailabilities/{subscription_id}/availableTerritories',
                  headers=headers,
                  params={'limit':'200'},
                  timeout=30
              )
              if verify.status_code != 200:
                  raise SystemExit(f'{product_id}: Verifikation HTTP {verify.status_code}\n{verify.text[:3000]}')
              count = len(verify.json().get('data', []))
              print(f'{product_id}: verfügbare Territories = {count}')
              if count != len(territories):
                  raise SystemExit(f'{product_id}: erwartet {len(territories)} Territories, erhalten {count}')
          PY
      - name: Key entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
