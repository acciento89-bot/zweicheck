name: ZweiCheck iOS CI

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'assets/brand/**'
      - '.github/workflows/ios-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'assets/brand/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: Build-Werkzeuge installieren
        run: brew install xcodegen
      - name: Kanonisches App-Icon prüfen
        shell: bash
        run: |
          set -euo pipefail
          TARGET="ios/ZweiCheck/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          test -s "$TARGET"
          WIDTH=$(sips -g pixelWidth "$TARGET" | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight "$TARGET" | awk '/pixelHeight/ {print $2}')
          test "$WIDTH" = "1024" && test "$HEIGHT" = "1024"
          ALPHA=$(sips -g hasAlpha "$TARGET" | awk '/hasAlpha/ {print $2}')
          test "$ALPHA" = "no"
          echo "ZweiCheck App-Icon: ${WIDTH}x${HEIGHT}, ohne Alpha"
      - name: Xcode-Projekt erzeugen
        working-directory: ios
        run: xcodegen generate
      - name: Native iOS-App bauen
        working-directory: ios
        run: |
          xcodebuild \
            -project ZweiCheck.xcodeproj \
            -scheme ZweiCheck \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ZweiCheckDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: App- und Share-Versionen vergleichen
        shell: bash
        run: |
          set -euo pipefail
          APP_PLIST="$RUNNER_TEMP/ZweiCheckDerivedData/Build/Products/Debug-iphonesimulator/ZweiCheck.app/Info.plist"
          SHARE_PLIST="$RUNNER_TEMP/ZweiCheckDerivedData/Build/Products/Debug-iphonesimulator/ZweiCheck.app/PlugIns/ZweiCheckShare.appex/Info.plist"
          test -f "$APP_PLIST"
          test -f "$SHARE_PLIST"

          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")
          SHARE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$SHARE_PLIST")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")
          SHARE_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$SHARE_PLIST")

          echo "App:   ${APP_VERSION} (${APP_BUILD})"
          echo "Share: ${SHARE_VERSION} (${SHARE_BUILD})"
          test "$APP_VERSION" = "$SHARE_VERSION"
          test "$APP_BUILD" = "$SHARE_BUILD"
