name: Phase 3 Bootstrap

on:
  push:
    branches: [phase-3-mvp]
    paths:
      - tools/phase3-bootstrap.py
      - tools/bootstrap/**
      - .github/workflows/phase3-bootstrap.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phase-3-Dateien entpacken
        run: python3 tools/phase3-bootstrap.py
      - name: Phase-3-Stand committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Phase 3 MVP" || exit 0
          git push
