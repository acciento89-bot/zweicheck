name: ZweiCheck Android CI

on:
  push:
    branches:
      - main
      - 'android/**'
    paths:
      - 'android/**'
      - 'ios/ZweiCheck/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png'
      - 'store/google-play/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/ZweiCheck/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png'
      - 'store/google-play/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify exact iOS and Android launcher identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'android:icon="@drawable/zweicheck_app_icon"' android/app/src/main/AndroidManifest.xml
          ! grep -Fq 'android:roundIcon=' android/app/src/main/AndroidManifest.xml
          test ! -e android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test ! -e android/app/src/main/res/drawable/zweicheck_app_icon.xml
          test ! -e android/app/src/main/res/drawable/zweicheck_launcher_background.xml
          test ! -e android/app/src/main/res/drawable/zweicheck_launcher_foreground.xml
          cmp -s ios/ZweiCheck/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png android/app/src/main/res/drawable-nodpi/zweicheck_app_icon.png
          mkdir -p android/play-assets
          cp store/google-play/icon-512.png android/play-assets/icon-512.png
          file android/play-assets/icon-512.png
          test "$(stat -c%s android/play-assets/icon-512.png)" -lt 1048576
          sha256sum ios/ZweiCheck/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png android/app/src/main/res/drawable-nodpi/zweicheck_app_icon.png android/play-assets/icon-512.png
          sha256sum android/play-assets/icon-512.png > android/play-assets/icon-512.png.sha256
      - name: Unit tests
        run: gradle -p android testDebugUnitTest --stacktrace
      - name: Build debug AAB
        run: gradle -p android bundleDebug --stacktrace
      - name: Build release AAB
        run: gradle -p android bundleRelease --stacktrace
      - name: Verify release identity, UX and native security gates
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/bundle/release/app-release.aab
          grep -Fq 'applicationId = "de.kamilunavo.zweicheck"' android/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' android/app/build.gradle.kts
          grep -Fq 'versionCode = 4' android/app/build.gradle.kts
          grep -Fq 'versionName = "1.0.3"' android/app/build.gradle.kts
          grep -Fq 'private val ZweiCheckColors' android/app/src/main/java/de/kamilunavo/zweicheck/MainActivity.kt
          grep -Fq 'BackHandler(enabled = user != null)' android/app/src/main/java/de/kamilunavo/zweicheck/MainActivity.kt
          grep -Fq 'statusBarsPadding' android/app/src/main/java/de/kamilunavo/zweicheck/MainActivity.kt
          grep -Fq 'recommendationLabel' android/app/src/main/java/de/kamilunavo/zweicheck/MainActivity.kt
          grep -Fq 'val statusLabel: String' android/app/src/main/java/de/kamilunavo/zweicheck/Models.kt
          grep -Fq 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'zc_session' android/app/src/main/java/de/kamilunavo/zweicheck/ApiClient.kt
          grep -Fq 'AndroidKeyStore' android/app/src/main/java/de/kamilunavo/zweicheck/SessionStore.kt
          grep -Fq 'images.take(3)' android/app/src/main/java/de/kamilunavo/zweicheck/ApiClient.kt
          grep -Fq 'android.intent.action.SEND_MULTIPLE' android/app/src/main/AndroidManifest.xml
          grep -Fq 'com.android.billingclient:billing-ktx:9.1.0' android/app/build.gradle.kts
          grep -Fq 'de.kamilunavo.zweicheck.family.monthly' android/app/src/main/java/de/kamilunavo/zweicheck/BillingManager.kt
          grep -Fq 'de.kamilunavo.zweicheck.family.yearly' android/app/src/main/java/de/kamilunavo/zweicheck/BillingManager.kt
          grep -Fq 'Käufe wiederherstellen' android/app/src/main/java/de/kamilunavo/zweicheck/MainActivity.kt
          grep -Fq 'com.google.firebase:firebase-bom:34.17.0' android/app/build.gradle.kts
          grep -Fq 'firebase_messaging_auto_init_enabled' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:value="false"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'com.google.firebase.MESSAGING_EVENT' android/app/src/main/AndroidManifest.xml
          grep -Fq 'FcmRegistration.enableAndRegister' android/app/src/main/java/de/kamilunavo/zweicheck/MainActivity.kt
          grep -Fq '/api/push/fcm/tokens' android/app/src/main/java/de/kamilunavo/zweicheck/FcmRegistration.kt
          grep -Fq 'EXTRA_CHECK_ID' android/app/src/main/java/de/kamilunavo/zweicheck/ZweiCheckMessagingService.kt
          if grep -RFn --include='*.kt' --include='*.xml' 'FIREBASE_SERVICE_ACCOUNT_JSON_B64' android/app/src; then
            echo 'Server Firebase service-account secret marker leaked into Android source.' >&2
            exit 1
          fi
      - name: Upload unsigned review assets
        uses: actions/upload-artifact@v4
        with:
          name: ZweiCheck-1.0.3-4-unsigned-review
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/play-assets/icon-512.png
            android/play-assets/icon-512.png.sha256
          if-no-files-found: error
          retention-days: 30
