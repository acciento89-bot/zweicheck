name: Dispatch ZweiCheck TestFlight once

on:
  push:
    branches: [main]
    paths:
      - '.github/release-testflight-disabled'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: TestFlight starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight.yml --ref main --repo "$GITHUB_REPOSITORY"
