name: ZweiCheck iOS parity rebuild

on:
  push:
    branches:
      - fix/android-ios-parity-20260913
    paths:
      - .github/workflows/zweicheck-ios-parity-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/android-ios-parity-20260913
          fetch-depth: 0

      - name: Align Android shell and Home with SwiftUI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          api = Path('android/app/src/main/java/de/kamilunavo/zweicheck/ApiClient.kt')
          a = api.read_text()
          anchor = '''    suspend fun requestPasswordReset(email: String) {
              request("/api/auth/request-password-reset", "POST", JSONObject().put("email", email))
          }
          '''
          if 'suspend fun resendVerification()' not in a:
              replacement = anchor + '''
              suspend fun resendVerification() {
                  request("/api/auth/resend-verification", "POST")
              }
          '''
              if anchor not in a:
                  raise SystemExit('ApiClient password reset anchor not found')
              a = a.replace(anchor, replacement, 1)
          api.write_text(a)

          p = Path('android/app/src/main/java/de/kamilunavo/zweicheck/MainActivity.kt')
          s = p.read_text()

          if 'import android.graphics.Color as AndroidColor' not in s:
              s = s.replace('import android.os.Bundle\n', 'import android.os.Bundle\nimport android.graphics.Color as AndroidColor\n')
          if 'import androidx.activity.SystemBarStyle' not in s:
              s = s.replace('import androidx.activity.ComponentActivity\n', 'import androidx.activity.ComponentActivity\nimport androidx.activity.SystemBarStyle\nimport androidx.activity.enableEdgeToEdge\n')
          if 'import androidx.compose.foundation.layout.WindowInsets' not in s:
              s = s.replace('import androidx.compose.foundation.layout.Spacer\n', 'import androidx.compose.foundation.layout.Spacer\nimport androidx.compose.foundation.layout.WindowInsets\n')
          if 'import androidx.compose.foundation.layout.safeDrawing' not in s:
              s = s.replace('import androidx.compose.foundation.layout.padding\n', 'import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.safeDrawing\n')

          s = s.replace(
              '        super.onCreate(savedInstanceState)\n        setContent { ZweiCheckApp(this) }',
              '        super.onCreate(savedInstanceState)\n        enableEdgeToEdge(\n            statusBarStyle = SystemBarStyle.light(AndroidColor.TRANSPARENT, AndroidColor.TRANSPARENT),\n            navigationBarStyle = SystemBarStyle.light(AndroidColor.TRANSPARENT, AndroidColor.TRANSPARENT),\n        )\n        setContent { ZweiCheckApp(this) }'
          )

          state_anchor = '''    var message by remember { mutableStateOf<String?>(null) }
              var sharedDraft by remember { mutableStateOf(extractSharedDraft(activity)) }
          '''
          if 'var activities by remember' not in s:
              state_replacement = '''    var message by remember { mutableStateOf<String?>(null) }
              var sharedDraft by remember { mutableStateOf(extractSharedDraft(activity)) }
              var activities by remember { mutableStateOf<List<ActivityItem>>(emptyList()) }
              var unreadActivityCount by remember { mutableStateOf(0) }
              var showActivities by remember { mutableStateOf(false) }
              var activityUnreadOnly by remember { mutableStateOf(false) }
          '''
              if state_anchor not in s:
                  raise SystemExit('ZweiCheck state anchor not found')
              s = s.replace(state_anchor, state_replacement, 1)

          refresh_old = '''    suspend fun refresh() {
              checks = api.checks()
              trust = api.trustRouting()
          }
          '''
          refresh_new = '''    suspend fun refreshActivities(unreadOnly: Boolean = activityUnreadOnly) {
              runCatching { api.activities(if (unreadOnly) "unread" else "all") }
                  .onSuccess {
                      activities = it.activities
                      unreadActivityCount = it.unreadCount
                  }
          }

              suspend fun refresh() {
                  checks = api.checks()
                  trust = api.trustRouting()
                  refreshActivities()
              }
          '''
          if 'suspend fun refreshActivities' not in s:
              if refresh_old not in s:
                  raise SystemExit('refresh anchor not found')
              s = s.replace(refresh_old, refresh_new, 1)

          s = s.replace(
              '''            creating -> NewCheckScreen(''',
              '''            showActivities -> ActivityScreen(
                  activities = activities,
                  unreadCount = unreadActivityCount,
                  unreadOnly = activityUnreadOnly,
                  onClose = { showActivities = false },
                  onFilter = { unreadOnly ->
                      activityUnreadOnly = unreadOnly
                      scope.launch { refreshActivities(unreadOnly) }
                  },
                  onMarkAllRead = {
                      scope.launch {
                          runCatching { api.markAllActivitiesRead() }
                              .onSuccess { refreshActivities() }
                              .onFailure { message = it.message }
                      }
                  },
                  onOpen = { activityItem ->
                      scope.launch {
                          if (activityItem.isUnread) runCatching { api.markActivityRead(activityItem.id) }
                          activityItem.checkId?.let {
                              highlightedCheckId = it
                              tab = Tab.CHECKS
                          }
                          showActivities = false
                          refreshActivities()
                      }
                  },
              )

              creating -> NewCheckScreen(''',
              1
          )

          s = s.replace(
              '            else -> Scaffold(\n                containerColor = MaterialTheme.colorScheme.background,',
              '            else -> Scaffold(\n                containerColor = MaterialTheme.colorScheme.background,\n                contentWindowInsets = WindowInsets.safeDrawing,'
          )

          old_call = 'Tab.HOME -> HomeScreen(user!!, checks, trust, billing.isPremiumFamily, onNewCheck = { creating = true }, onPremium = { tab = Tab.ACCOUNT })'
          new_call = '''Tab.HOME -> HomeScreen(
                              user = user!!,
                              checks = checks,
                              trust = trust,
                              sharedDraft = sharedDraft,
                              unreadActivityCount = unreadActivityCount,
                              onActivities = { showActivities = true },
                              onNewCheck = { creating = true },
                              onResendVerification = {
                                  scope.launch {
                                      runCatching { api.resendVerification() }
                                          .onSuccess { message = "Bestätigungs-E-Mail wurde erneut gesendet." }
                                          .onFailure { message = it.message }
                                  }
                              },
                          )'''
          if old_call not in s:
              raise SystemExit('Home call anchor not found')
          s = s.replace(old_call, new_call, 1)

          new_home = r'''@Composable
          private fun HomeScreen(
              user: User,
              checks: List<CheckItem>,
              trust: TrustRouting?,
              sharedDraft: ShareDraft?,
              unreadActivityCount: Int,
              onActivities: () -> Unit,
              onNewCheck: () -> Unit,
              onResendVerification: () -> Unit,
          ) {
              LazyColumn(
                  Modifier.fillMaxSize(),
                  contentPadding = androidx.compose.foundation.layout.PaddingValues(top = 24.dp, bottom = 28.dp),
                  verticalArrangement = Arrangement.spacedBy(22.dp),
              ) {
                  item {
                      Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                          Column(Modifier.weight(1f)) {
                              Text("Hallo ${user.name}", style = MaterialTheme.typography.headlineLarge, fontWeight = FontWeight.Bold, color = Navy)
                              Text(
                                  "Wenn dir etwas komisch vorkommt, frag erst eine Person, der du vertraust.",
                                  style = MaterialTheme.typography.titleMedium,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  modifier = Modifier.padding(top = 6.dp),
                              )
                          }
                          Box(contentAlignment = Alignment.TopEnd) {
                              IconButton(onClick = onActivities) { Icon(Icons.Default.Notifications, "Aktivitäten", tint = Navy) }
                              if (unreadActivityCount > 0) {
                                  Surface(color = Color(0xFFC33D42), shape = RoundedCornerShape(20.dp)) {
                                      Text(
                                          if (unreadActivityCount > 99) "99+" else unreadActivityCount.toString(),
                                          color = Color.White,
                                          fontSize = 10.sp,
                                          fontWeight = FontWeight.Bold,
                                          modifier = Modifier.padding(horizontal = 5.dp, vertical = 2.dp),
                                      )
                                  }
                              }
                          }
                      }
                  }

                  if (!user.emailVerified) {
                      item {
                          Surface(color = Orange.copy(alpha = 0.12f), shape = RoundedCornerShape(18.dp), modifier = Modifier.fillMaxWidth()) {
                              Column(Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                                  Text("Bitte bestätige deine E-Mail-Adresse", fontWeight = FontWeight.Bold, color = Navy)
                                  Text("Danach kannst du Prüfanfragen senden und beantworten.", color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  OutlinedButton(onClick = onResendVerification) { Text("E-Mail erneut senden", fontWeight = FontWeight.Bold) }
                              }
                          }
                      }
                  }

                  if (sharedDraft != null) {
                      item {
                          Surface(color = Teal.copy(alpha = 0.10f), shape = RoundedCornerShape(18.dp), modifier = Modifier.fillMaxWidth()) {
                              Column(Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                  Text("Aus dem Teilen-Menü übernommen", fontWeight = FontWeight.Bold, color = Navy)
                                  Text("Der Inhalt ist vorbereitet. Wähle nur noch deine Vertrauensperson und prüfe alles vor dem Absenden.", color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  OutlinedButton(onClick = onNewCheck) { Text("Entwurf jetzt prüfen", fontWeight = FontWeight.Bold) }
                              }
                          }
                      }
                  }

                  item {
                      PrimaryAction(
                          "Ich bin unsicher – prüfen lassen",
                          onNewCheck,
                          enabled = !trust?.connections.isNullOrEmpty() && user.emailVerified,
                      )
                      if (trust?.connections.isNullOrEmpty()) {
                          Text(
                              "Verbinde zuerst unter „Personen“ jemanden, dem du vertraust.",
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                              modifier = Modifier.padding(top = 8.dp),
                          )
                      }
                  }

                  checks.firstOrNull()?.let { newest ->
                      item {
                          AppCard {
                              Text("Letzte Prüfung", fontWeight = FontWeight.Bold)
                              Text(newest.categoryLabel, style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold, modifier = Modifier.padding(top = 8.dp))
                              Text(
                                  if (newest.status == "open" || newest.status == "pending") "Wartet auf Rückmeldung" else newest.recommendationLabel ?: "Beantwortet",
                                  color = if (newest.status == "open" || newest.status == "pending") Orange else Teal,
                                  fontWeight = FontWeight.SemiBold,
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          private fun ActivityScreen(
              activities: List<ActivityItem>,
              unreadCount: Int,
              unreadOnly: Boolean,
              onClose: () -> Unit,
              onFilter: (Boolean) -> Unit,
              onMarkAllRead: () -> Unit,
              onOpen: (ActivityItem) -> Unit,
          ) {
              Surface(color = AppBackground, modifier = Modifier.fillMaxSize()) {
                  Column(Modifier.fillMaxSize().statusBarsPadding().padding(horizontal = 20.dp)) {
                      Row(Modifier.fillMaxWidth().padding(top = 12.dp, bottom = 10.dp), verticalAlignment = Alignment.CenterVertically) {
                          TextButton(onClick = onClose) { Text("Schließen") }
                          Text("Aktivitäten", modifier = Modifier.weight(1f), textAlign = TextAlign.Center, fontSize = 24.sp, fontWeight = FontWeight.Bold, color = Navy)
                          if (unreadCount > 0) TextButton(onClick = onMarkAllRead) { Text("Alle gelesen") }
                          else Spacer(Modifier.width(76.dp))
                      }
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedButton(onClick = { onFilter(false) }, modifier = Modifier.weight(1f)) { Text("Alle", fontWeight = if (!unreadOnly) FontWeight.Bold else FontWeight.Normal) }
                          OutlinedButton(onClick = { onFilter(true) }, modifier = Modifier.weight(1f)) { Text("Ungelesen", fontWeight = if (unreadOnly) FontWeight.Bold else FontWeight.Normal) }
                      }
                      if (activities.isEmpty()) {
                          Column(Modifier.fillMaxSize(), verticalArrangement = Arrangement.Center, horizontalAlignment = Alignment.CenterHorizontally) {
                              Icon(Icons.Default.Notifications, null, tint = Teal, modifier = Modifier.size(48.dp))
                              Text(if (unreadOnly) "Keine ungelesenen Aktivitäten" else "Noch keine Aktivitäten", fontWeight = FontWeight.Bold, fontSize = 20.sp, color = Navy, modifier = Modifier.padding(top = 14.dp))
                              Text("Neue Prüfanfragen, Antworten, Erinnerungen und Einladungen erscheinen hier.", textAlign = TextAlign.Center, color = MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.padding(top = 8.dp, start = 20.dp, end = 20.dp))
                          }
                      } else {
                          LazyColumn(contentPadding = androidx.compose.foundation.layout.PaddingValues(vertical = 14.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              items(activities, key = { it.id }) { activityItem ->
                                  Surface(onClick = { onOpen(activityItem) }, color = Color.White, shape = RoundedCornerShape(18.dp), modifier = Modifier.fillMaxWidth()) {
                                      Row(Modifier.padding(16.dp), verticalAlignment = Alignment.Top) {
                                          Icon(Icons.Default.Notifications, null, tint = if (activityItem.isUnread) Teal else MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.size(26.dp))
                                          Column(Modifier.weight(1f).padding(start = 14.dp)) {
                                              Row(verticalAlignment = Alignment.CenterVertically) {
                                                  Text(activityItem.title, fontWeight = FontWeight.Bold, color = Navy, modifier = Modifier.weight(1f))
                                                  if (activityItem.isUnread) Surface(color = Teal, shape = RoundedCornerShape(5.dp), modifier = Modifier.size(9.dp)) {}
                                              }
                                              Text(activityItem.body, color = MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.padding(top = 5.dp))
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          '''

          pattern = re.compile(r'@Composable\nprivate fun HomeScreen\(.*?\n@Composable\nprivate fun Stat\(', re.S)
          if not pattern.search(s):
              raise SystemExit('HomeScreen block not found')
          s = pattern.sub(new_home + '\n@Composable\nprivate fun Stat(', s, count=1)

          p.write_text(s)
          PY

          grep -Fq 'enableEdgeToEdge' android/app/src/main/java/de/kamilunavo/zweicheck/MainActivity.kt
          grep -Fq 'contentWindowInsets = WindowInsets.safeDrawing' android/app/src/main/java/de/kamilunavo/zweicheck/MainActivity.kt
          grep -Fq 'Bitte bestätige deine E-Mail-Adresse' android/app/src/main/java/de/kamilunavo/zweicheck/MainActivity.kt
          grep -Fq 'Aus dem Teilen-Menü übernommen' android/app/src/main/java/de/kamilunavo/zweicheck/MainActivity.kt
          grep -Fq 'private fun ActivityScreen' android/app/src/main/java/de/kamilunavo/zweicheck/MainActivity.kt
          grep -Fq 'suspend fun resendVerification' android/app/src/main/java/de/kamilunavo/zweicheck/ApiClient.kt
          git diff --check

      - name: Commit parity rebuild
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Kamilunavo
          git config user.email acciento89@gmail.com
          git add android/app/src/main/java/de/kamilunavo/zweicheck/MainActivity.kt android/app/src/main/java/de/kamilunavo/zweicheck/ApiClient.kt
          git commit -m 'feat(zweicheck): match Android home and activity flow to iOS'
          git push origin HEAD:fix/android-ios-parity-20260913
