name: ZweiCheck Android Play Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ZWEICHECK_FIREBASE_PROJECT_ID: zweicheck
      ZWEICHECK_FIREBASE_APP_ID: 1:569737949733:android:b959136242819d9367c5cc
      ZWEICHECK_FIREBASE_API_KEY: AIzaSyDwY42Jur0Jw4vGLqN8DkMunDaHeRlgTQg
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$ZWEICHECK_FIREBASE_PROJECT_ID" = 'zweicheck'
          test "$ZWEICHECK_FIREBASE_APP_ID" = '1:569737949733:android:b959136242819d9367c5cc'
          [[ "$ZWEICHECK_FIREBASE_API_KEY" =~ ^AIza[A-Za-z0-9_-]+$ ]]
          test -n '${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}'
          test -n "$ANDROID_UPLOAD_STORE_PASSWORD"
          test -n "$ANDROID_UPLOAD_KEY_ALIAS"
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD"

      - name: Restore Play upload keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}' | base64 --decode > "$RUNNER_TEMP/zweicheck-upload.jks"
          chmod 600 "$RUNNER_TEMP/zweicheck-upload.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/zweicheck-upload.jks" >> "$GITHUB_ENV"

      - name: Tests
        run: gradle -p android testDebugUnitTest --stacktrace

      - name: Build signed release AAB
        run: gradle -p android bundleRelease --stacktrace

      - name: Verify Play release
        shell: bash
        run: |
          set -euo pipefail
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          grep -Fq 'applicationId = "de.kamilunavo.zweicheck"' android/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' android/app/build.gradle.kts
          grep -Fq 'versionCode = 2' android/app/build.gradle.kts
          grep -Fq 'versionName = "1.0.1"' android/app/build.gradle.kts
          grep -Fq 'de.kamilunavo.zweicheck.family.monthly' android/app/src/main/java/de/kamilunavo/zweicheck/BillingManager.kt
          grep -Fq 'de.kamilunavo.zweicheck.family.yearly' android/app/src/main/java/de/kamilunavo/zweicheck/BillingManager.kt
          jarsigner -verify -verbose -certs "$AAB" | tee /tmp/jarsigner.txt
          grep -Fq 'jar verified.' /tmp/jarsigner.txt
          cp "$AAB" android/app/build/outputs/bundle/release/ZweiCheck-1.0.1-2-PlayStore.aab
          sha256sum "$AAB" | tee android/app/build/outputs/bundle/release/ZweiCheck-1.0.1-2-PlayStore.aab.sha256

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: ZweiCheck-1.0.1-2-PlayStore
          path: |
            android/app/build/outputs/bundle/release/ZweiCheck-1.0.1-2-PlayStore.aab
            android/app/build/outputs/bundle/release/ZweiCheck-1.0.1-2-PlayStore.aab.sha256
          if-no-files-found: error
          retention-days: 14
