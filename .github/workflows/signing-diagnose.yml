name: ZweiCheck Signing Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/signing-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-26
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: API Key bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Python-Umgebung
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet pyjwt cryptography requests
      - name: Apple Provisioning, Builds und App-Version prüfen
        shell: bash
        run: |
          "$RUNNER_TEMP/asc-venv/bin/python" - <<'PY'
          import json, os, time, jwt, requests
          key = open(os.environ['RUNNER_TEMP'] + '/AuthKey.p8', 'r', encoding='utf-8').read()
          token = jwt.encode(
              {'iss': os.environ['ASC_ISSUER_ID'], 'iat': int(time.time()), 'exp': int(time.time()) + 600, 'aud': 'appstoreconnect-v1'},
              key,
              algorithm='ES256',
              headers={'kid': os.environ['ASC_KEY_ID'], 'typ': 'JWT'}
          )
          headers = {'Authorization': f'Bearer {token}'}
          base = 'https://api.appstoreconnect.apple.com/v1'

          for identifier in ['de.kamilunavo.zweicheck', 'de.kamilunavo.zweicheck.share']:
              r = requests.get(base + '/bundleIds', headers=headers, params={
                  'filter[identifier]': identifier,
                  'include': 'bundleIdCapabilities,profiles',
                  'limit': '10'
              }, timeout=30)
              print(f'BUNDLE {identifier}: HTTP {r.status_code}')
              if r.status_code != 200:
                  print(r.text[:3000])
                  continue
              payload = r.json()
              data = payload.get('data', [])
              print(f'  found={len(data)}')
              if data:
                  print(f"  id={data[0].get('id')} platform={data[0].get('attributes',{}).get('platform')}")
              caps=[]; profiles=[]
              for item in payload.get('included', []):
                  if item.get('type') == 'bundleIdCapabilities':
                      caps.append(item.get('attributes',{}).get('capabilityType'))
                  elif item.get('type') == 'profiles':
                      a=item.get('attributes',{})
                      profiles.append((a.get('name'), a.get('profileType'), a.get('profileState')))
              print('  capabilities=' + ','.join(sorted(set(filter(None,caps)))))
              print('  profiles=' + repr(profiles))

          r = requests.get(base + '/certificates', headers=headers, params={'limit':'50'}, timeout=30)
          print(f'CERTIFICATES: HTTP {r.status_code}')
          if r.status_code == 200:
              certs=[]
              for c in r.json().get('data', []):
                  a=c.get('attributes',{})
                  certs.append((a.get('certificateType'), a.get('displayName'), a.get('activated'), a.get('expirationDate')))
              print('  ' + repr(certs))
          else:
              print(r.text[:3000])

          app_resp = requests.get(base + '/apps', headers=headers, params={
              'filter[bundleId]': 'de.kamilunavo.zweicheck',
              'limit': '10'
          }, timeout=30)
          print(f'APP LOOKUP: HTTP {app_resp.status_code}')
          if app_resp.status_code != 200:
              print(app_resp.text[:5000])
              raise SystemExit(1)
          apps = app_resp.json().get('data', [])
          exact = [a for a in apps if a.get('attributes',{}).get('bundleId') == 'de.kamilunavo.zweicheck']
          if len(exact) != 1:
              print('App nicht eindeutig gefunden:', len(exact))
              raise SystemExit(1)
          app_id = exact[0]['id']
          print('APP ID:', app_id)

          uploads = requests.get(base + f'/apps/{app_id}/buildUploads', headers=headers, params={
              'filter[platform]': 'IOS',
              'fields[buildUploads]': 'cfBundleShortVersionString,cfBundleVersion,createdDate,state,platform,uploadedDate,build',
              'include': 'build',
              'fields[builds]': 'version,uploadedDate,processingState,usesNonExemptEncryption,minOsVersion',
              'sort': '-uploadedDate',
              'limit': '10'
          }, timeout=30)
          print(f'BUILD UPLOADS: HTTP {uploads.status_code}')
          if uploads.status_code != 200:
              print(uploads.text[:10000])
              raise SystemExit(1)

          payload = uploads.json()
          included = {i.get('id'): i for i in payload.get('included', []) if i.get('type') == 'builds'}
          for upload in payload.get('data', []):
              a = upload.get('attributes', {})
              state = a.get('state')
              print('\nUPLOAD', upload.get('id'))
              print('  version=', a.get('cfBundleShortVersionString'), 'build=', a.get('cfBundleVersion'), 'uploaded=', a.get('uploadedDate'))
              print('  state=', json.dumps(state, ensure_ascii=False, indent=2))
              rel = upload.get('relationships',{}).get('build',{}).get('data')
              if rel and rel.get('id') in included:
                  ba = included[rel['id']].get('attributes',{})
                  print('  build.id=', rel['id'], 'processingState=', ba.get('processingState'), 'build.version=', ba.get('version'), 'minOS=', ba.get('minOsVersion'))

          versions = requests.get(base + f'/apps/{app_id}/appStoreVersions', headers=headers, params={
              'filter[platform]': 'IOS',
              'fields[appStoreVersions]': 'platform,versionString,appStoreState,appVersionState,createdDate,build,appStoreVersionSubmission',
              'include': 'build,appStoreVersionSubmission',
              'fields[builds]': 'version,uploadedDate,processingState,usesNonExemptEncryption,minOsVersion',
              'limit': '20'
          }, timeout=30)
          print(f'\nAPP STORE VERSIONS: HTTP {versions.status_code}')
          if versions.status_code != 200:
              print(versions.text[:10000])
              raise SystemExit(1)
          vp = versions.json()
          vbuilds = {i.get('id'): i for i in vp.get('included', []) if i.get('type') == 'builds'}
          submissions = {i.get('id'): i for i in vp.get('included', []) if i.get('type') == 'appStoreVersionSubmissions'}
          for version in vp.get('data', []):
              a = version.get('attributes', {})
              print('\nVERSION', version.get('id'), a.get('versionString'), a.get('platform'))
              print('  appStoreState=', a.get('appStoreState'), 'appVersionState=', a.get('appVersionState'), 'created=', a.get('createdDate'))
              brel = version.get('relationships',{}).get('build',{}).get('data')
              if brel:
                  b = vbuilds.get(brel.get('id'), {})
                  ba = b.get('attributes',{})
                  print('  attachedBuild.id=', brel.get('id'), 'version=', ba.get('version'), 'processingState=', ba.get('processingState'), 'uploaded=', ba.get('uploadedDate'))
              else:
                  print('  attachedBuild=None')
              srel = version.get('relationships',{}).get('appStoreVersionSubmission',{}).get('data')
              print('  submission=', srel)
          PY
      - name: Key entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
