<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061a2f">
  <meta name="description" content="ZweiCheck – Gemeinsam prüfen. Sicher handeln.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ZweiCheck">
  <meta name="apple-itunes-app" content="app-id=6800781224">
  <meta name="format-detection" content="telephone=no">
  <meta name="zweicheck-build" content="release-1.0.0">
  <meta name="zweicheck-ux" content="senior-first-v1">
  <meta name="zweicheck-accessibility" content="senior-a11y-v1">
  <meta name="zweicheck-release" content="1.0.0">
  <title>ZweiCheck</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/brand/zweicheck-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css?v=2">
  <link rel="stylesheet" href="/activity-center.css?v=2">
  <link rel="stylesheet" href="/trust-routing.css?v=1">
  <link rel="stylesheet" href="/escalation.css?v=2">
  <link rel="stylesheet" href="/account.css?v=2">
</head>
<body>
  <a class="skip-link" href="#app">Direkt zum Inhalt</a>
  <noscript>Für ZweiCheck muss JavaScript aktiviert sein.</noscript>
  <div id="app" tabindex="-1"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive" aria-atomic="true"></div>
  <footer aria-label="Rechtliches" style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap;padding:18px 20px 28px;font:500 14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#607086">
    <a href="/imprint" style="color:#087b7b">Impressum</a>
    <a href="/privacy" style="color:#087b7b">Datenschutz</a>
    <a href="/support" style="color:#087b7b">Support</a>
  </footer>
  <script src="/app.js?v=7" defer></script>
  <script src="/deep-link.js?v=1" defer></script>
  <script src="/push-client.js?v=1" defer></script>
  <script src="/activity-center.js?v=2" defer></script>
  <script src="/trust-routing.js?v=3" defer></script>
  <script src="/escalation-client.js?v=4" defer></script>
  <script src="/account-client.js?v=2" defer></script>
  <script>
    (() => {
      const root = document.querySelector('#app');
      if (!root) return;

      const addAppStoreBadge = () => {
        const brand = root.querySelector('.auth-brand');
        if (!brand || brand.querySelector('[data-app-store-badge]')) return;

        const link = document.createElement('a');
        link.href = 'https://apps.apple.com/app/zweicheck/id6800781224';
        link.target = '_blank';
        link.rel = 'noreferrer';
        link.setAttribute('data-app-store-badge', 'true');
        link.setAttribute('aria-label', 'ZweiCheck im App Store laden');
        link.style.display = 'inline-block';
        link.style.marginTop = '18px';
        link.style.lineHeight = '0';

        const badge = document.createElement('img');
        badge.src = 'https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/de-de?size=250x83';
        badge.alt = 'Laden im App Store';
        badge.width = 170;
        badge.height = 56;
        badge.style.display = 'block';
        badge.style.width = '170px';
        badge.style.height = 'auto';

        link.append(badge);
        brand.append(link);
      };

      new MutationObserver(addAppStoreBadge).observe(root, { childList: true, subtree: true });
      addAppStoreBadge();
    })();
  </script>
</body>
</html>
